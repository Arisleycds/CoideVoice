<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>DeepEdit</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <header class="header">
      <h1>🛠️ DeepEdit</h1>
      <div class="project-badge" id="project-badge">Nenhum projeto</div>
    </header>

    <div class="toolbar">
      <button id="btn-open-projects" class="btn btn-secondary">📁 Projetos</button>
      <button id="btn-open-main-chat" class="btn btn-primary">1️⃣ Chat Principal</button>
      <button id="btn-open-design-chat" class="btn btn-secondary">2️⃣ Chat Design</button>
      <button id="btn-open-edit-chat" class="btn btn-secondary">3️⃣ Chat de Edição</button>
      <button id="btn-refresh" class="btn btn-secondary">🔄 Atualizar</button>
    </div>

    <div class="panel" id="projects-panel">
      <h2>📁 Projetos em C:\deepedit</h2>
      <div class="projects-actions">
        <button id="btn-new-project" class="btn btn-small btn-primary">➕ Novo Projeto</button>
      </div>
      <div id="projects-list" class="projects-list">
        <p class="placeholder">Carregando...</p>
      </div>
    </div>

    <div class="panel">
      <h2>📂 Arquivos</h2>
      <div class="breadcrumb" id="breadcrumb">/</div>
      <div id="file-list" class="file-list">
        <p class="placeholder">Selecione um projeto.</p>
      </div>
    </div>

    <div class="panel">
      <h2>⚙️ Operações Pendentes</h2>
      <div id="pending-ops" class="pending-ops">
        <p class="placeholder">Nenhuma operação.</p>
      </div>
      <div class="pending-actions">
        <button id="btn-run-pending" class="btn btn-small btn-primary" disabled>▶ Executar</button>
        <button id="btn-clear-pending" class="btn btn-small btn-danger" disabled>🗑 Limpar</button>
        <label class="auto-run"><input type="checkbox" id="btn-auto-run"> Auto-executar</label>
      </div>
    </div>

    <div class="panel">
      <h2>📜 Log</h2>
      <div id="log-output" class="log-output"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
