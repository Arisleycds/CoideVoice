<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0d1117">
  <meta name="color-scheme" content="dark">
  <title>DeepEdit</title>
  <style>
    html,
    body {
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 0;
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <header class="header">
      <h1>🛠️ DeepEdit</h1>
      <div class="project-badge" id="project-badge">Nenhum projeto</div>
      <span id="status-badge" class="status-badge status-ok">✅ Pronto</span>
    </header>

    <div class="toolbar">
      <button id="btn-open-conversa" class="btn btn-primary">💬 Conversa</button>
      <button id="btn-open-projects" class="btn btn-secondary">📁 Projetos</button>
      <button id="btn-open-conversador" class="btn btn-secondary">🗣️ Conversador (IA)</button>
      <button id="btn-open-edit" class="btn btn-secondary">⚙️ Edição (IA)</button>
      <button id="btn-refresh" class="btn btn-secondary">🔄 Atualizar</button>
      <button id="btn-git-snapshot" class="btn btn-secondary">💾 Snapshot</button>
      <button id="btn-git-undo" class="btn btn-secondary">↩️ Desfazer</button>
      <button id="btn-git-status" class="btn btn-secondary">📊 Git Status</button>
      <button id="btn-git-log" class="btn btn-secondary">📜 Git Log</button>
    </div>

    <div class="panel" id="projects-panel">
      <h2>📁 Projetos em C:\deepedit</h2>
      <div class="projects-actions">
        <button id="btn-new-project" class="btn btn-small btn-primary">➕ Novo Projeto</button>
      </div>
      <div id="projects-list" class="projects-list">
        <p class="placeholder">Carregando...</p>
      </div>
    </div>

    <div class="panel">
      <h2>📂 Arquivos</h2>
      <div class="breadcrumb" id="breadcrumb">/</div>
      <div id="file-list" class="file-list">
        <p class="placeholder">Selecione um projeto.</p>
      </div>
    </div>

    <div class="panel">
      <h2>⚙️ Operações</h2>
      <div id="pending-ops" class="pending-ops">
        <p class="placeholder">Nenhuma operação.</p>
      </div>
      <div class="pending-actions">
        <button id="btn-clear-pending" class="btn btn-small btn-danger" disabled>🗑 Limpar</button>
        <span class="hint-inline">Execução automática ativada</span>
      </div>
    </div>

    <div class="panel">
      <h2>👁️ Preview</h2>
      <div class="preview-controls">
        <select id="preview-file-select" class="btn btn-small">
          <option value="">— Selecione um HTML —</option>
        </select>
        <button id="btn-refresh-preview" class="btn btn-small">🔄 Recarregar</button>
      </div>
      <div id="preview-container" class="preview-container">
        <p class="placeholder">Nenhum arquivo HTML selecionado.</p>
      </div>
    </div>

    <div class="panel">
      <h2>🔁 Pipeline</h2>
      <div id="pipeline-log" class="pipeline-log">
        <p class="placeholder">Nenhum evento ainda.</p>
      </div>
    </div>

    <div class="panel">
      <h2>📜 Log</h2>
      <div id="log-output" class="log-output"></div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
