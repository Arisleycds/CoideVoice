<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0f1419">
  <meta name="color-scheme" content="dark">
  <title>Conversa — DeepEdit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0f1419;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100%;
    }

    header {
      padding: 10px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 0.3px;
    }

    header .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #21262d;
      color: #8b949e;
      font-weight: 600;
    }

    header .badge.active {
      background: #1f3d1f;
      color: #3fb950;
    }

    #status {
      font-size: 12px;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #status::before {
      content: '●';
      font-size: 10px;
      color: #8b949e;
    }

    #status.ok::before {
      color: #3fb950;
    }

    #status.busy::before {
      color: #d29922;
      animation: pulse 1s infinite;
    }

    #status.error::before {
      color: #f85149;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 8px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    .msg {
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .msg-user {
      align-self: flex-end;
      background: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-main {
      align-self: flex-start;
      background: #21262d;
      color: #e6edf3;
      border-bottom-left-radius: 4px;
      border-left: 3px solid #58a6ff;
    }

    .msg-edit {
      align-self: flex-start;
      background: #1a2b1a;
      color: #b8e8b8;
      border-bottom-left-radius: 4px;
      font-size: 12px;
      opacity: 0.9;
      border-left: 3px solid #3fb950;
    }

    .msg-system {
      align-self: center;
      background: #30363d;
      color: #8b949e;
      font-size: 11.5px;
      font-style: italic;
      border-radius: 8px;
      padding: 6px 12px;
      max-width: 95%;
    }

    .msg-system.ok {
      background: #1f3d1f;
      color: #3fb950;
      font-style: normal;
    }

    .msg-system.error {
      background: #3d1f1f;
      color: #f85149;
      font-style: normal;
    }

    .msg-system.warn {
      background: #3d341f;
      color: #d29922;
      font-style: normal;
    }

    .msg-meta {
      display: block;
      font-size: 10px;
      color: #6e7681;
      margin-top: 4px;
      opacity: 0.7;
    }

    .msg-main .msg-meta {
      color: #79c0ff;
    }

    .msg-edit .msg-meta {
      color: #56d364;
    }

    #typing {
      padding: 0 16px 8px;
      font-size: 12px;
      color: #8b949e;
      height: 18px;
      flex-shrink: 0;
      font-style: italic;
    }

    #inputRow {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #161b22;
      border-top: 1px solid #30363d;
      flex-shrink: 0;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      font-family: inherit;
      line-height: 1.4;
      transition: border-color 0.15s;
    }

    #input:focus {
      outline: none;
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15);
    }

    #input::placeholder {
      color: #6e7681;
    }

    #btnSend {
      padding: 0 22px;
      height: 44px;
      border-radius: 8px;
      border: none;
      background: #238636;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    #btnSend:hover:not(:disabled) {
      background: #2ea043;
    }

    #btnSend:active:not(:disabled) {
      transform: scale(0.98);
    }

    #btnSend:disabled {
      background: #21262d;
      color: #6e7681;
      cursor: not-allowed;
    }

    #hint {
      padding: 0 16px 8px;
      font-size: 11px;
      color: #6e7681;
      flex-shrink: 0;
      text-align: right;
    }

    #hint kbd {
      background: #21262d;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 10px;
      border: 1px solid #30363d;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="title">
        <h1>💬 Conversa</h1>
        <span class="badge" id="conn-badge">offline</span>
      </div>
      <div id="status">Inicializando...</div>
    </header>

    <div id="chat"></div>
    <div id="typing"></div>

    <div id="inputRow">
      <textarea id="input" placeholder="Fale sobre o jogo... O Conversador especifica e a Edição implementa."
        rows="1"></textarea>
      <button id="btnSend">Enviar</button>
    </div>

    <div id="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> envia · <kbd>Esc</kbd> limpa</div>
  </div>
  <script type="module" src="conversa.js"></script>
</body>

</html>
